<!--
  マージ×陣取り 試作3（ファイル名は v2 のまま。URLを 変えないため）。

  試作2への 社長評と 対応:
  - 「へい」バッジが 分からない → 格が 上がると 大きさ・色が 変わり、つよさを 数字で 出す
  - 陣地が 広がる 理屈が 不明   → マージの まわりが ひらく ことを 演出と 説明で 見せる
  - 草を 減らす 方法が 不明     → アリを 🌿に おくと「かりとる」。ごほうびに 🥚や 🟤が 出る
  - アリ塚を 増やす 仕組みが ない → 🟤つちのやま×3 → ⛰️アリづか。づかは 時間で 🥚を 増産
  - もっと Merge Dragons ふうに → さわらなくても 生産が 回り、マージ待ちの 2つは 光って さそう
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🐜</text></svg>">
<title>むしの もり（マージ陣取り 試作3）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; }
  body {
    background:#161d10; color:#eef4e0;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;
    user-select:none; -webkit-user-select:none;
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    touch-action:manipulation;
  }
  #goal {
    width:100%; max-width:430px; padding:max(6px,env(safe-area-inset-top)) 12px 2px;
    font-size:12px; color:#b9d391;
    display:flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden;
  }
  #goal span { overflow:hidden; text-overflow:ellipsis; }
  #goal b { color:#ffe27a; }
  #restart {
    margin-left:auto; flex:0 0 auto; font:inherit; font-size:12px;
    background:#33452a; color:#eef4e0; border:1px solid #56704a; border-radius:8px; padding:3px 8px;
  }
  #banner {
    width:100%; max-width:430px; min-height:38px; padding:2px 12px 4px;
    font-size:13px; line-height:1.45;
  }
  #tut {
    width:calc(100% - 16px); max-width:414px; background:#26331e; border:2px solid #8fd06a;
    border-radius:12px; padding:8px 10px; margin:0 8px 6px; font-size:13px; line-height:1.5;
    display:flex; align-items:center; gap:10px;
  }
  #tut.hidden { display:none; }
  #tut-skip {
    flex:0 0 auto; font:inherit; font-size:12px; background:#33452a; color:#cfe8ac;
    border:1px solid #56704a; border-radius:8px; padding:4px 8px;
  }
  #board { position:relative; border-radius:12px; background:#0f150a; padding:5px; }
  #tiles { display:grid; gap:2px; }
  .tile { width:var(--ts); height:var(--ts); border-radius:6px; position:relative; }
  .tile.p  { background:#4a7c3f; }
  .tile.p.alt { background:#548b47; }
  .tile.e  { background:#4a3050; }
  .tile.e.alt { background:#553a5c; }
  .tile.n  { background:#8b7d58; }
  .tile.n.alt { background:#948565; }
  .tile.locked { background:#2e3b22; }
  .tile.locked.alt { background:#33421f; }
  .tile.locked::after { content:"🌿"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:calc(var(--ts)*.5); opacity:.8; }
  .tile.sparkle.locked::after { content:"✨"; }
  .tile.claimflash { animation:claim .55s ease-out; }
  @keyframes claim { 0% { filter:brightness(2.4); } 100% { filter:none; } }

  #units { position:absolute; inset:5px; pointer-events:none; }
  .u {
    position:absolute; width:var(--ts); height:var(--ts);
    display:flex; align-items:center; justify-content:center;
    line-height:1;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.5));
    pointer-events:auto; transition:left .12s, top .12s;
    touch-action:none;
  }
  /* ---- 格ごとの 見た目: 大きさと 色が 変わる ---- */
  .t-egg     { font-size:calc(var(--ts)*.5); }
  .t-worker  { font-size:calc(var(--ts)*.56); }
  .t-soldier { font-size:calc(var(--ts)*.78); filter:hue-rotate(-25deg) saturate(1.8) brightness(1.05) drop-shadow(0 2px 1px rgba(0,0,0,.5)); }
  .t-major   { font-size:calc(var(--ts)*.95); filter:hue-rotate(-45deg) saturate(2.2) brightness(.85) contrast(1.15) drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .t-kabuto  { font-size:calc(var(--ts)*.92); }
  .t-dirt    { font-size:calc(var(--ts)*.5); }
  .t-moundS  { font-size:calc(var(--ts)*.62); }
  .t-queen, .t-nest { font-size:calc(var(--ts)*.8); }

  .u .badge {
    position:absolute; right:-3px; bottom:-3px; font-size:11px; font-weight:800;
    background:#243318; color:#ffe27a; border:1px solid #56704a; border-radius:8px; padding:0 4px;
  }
  .u.e .badge { background:#3d1f2c; color:#ffc9c9; border-color:#8a4a55; }
  .u .crown { position:absolute; left:-3px; top:-6px; font-size:13px; }
  .u.pop { animation:pop .4s ease-out; }
  @keyframes pop { 0% { transform:scale(.3); } 60% { transform:scale(1.4); } 100% { transform:scale(1); } }
  /* あと1つで マージ できる 2つ組は 光って さそう */
  .u.ready { animation:ready 1.1s ease-in-out infinite; }
  @keyframes ready { 50% { transform:scale(1.14); filter:drop-shadow(0 0 6px #ffe27a); } }
  /* かりとり中は もぐもぐ ゆれる */
  .u.harvest { animation:chew .5s ease-in-out infinite; }
  @keyframes chew { 50% { transform:rotate(9deg) scale(1.06); } }

  #ghost { position:fixed; pointer-events:none; font-size:34px; z-index:50; transform:translate(-50%,-60%); filter:drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
  .spark { position:absolute; pointer-events:none; font-size:14px; animation:fly .6s ease-out forwards; z-index:40; }
  @keyframes fly { to { transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0; } }

  #modal { position:fixed; inset:0; background:rgba(8,12,6,.75); display:flex; align-items:center; justify-content:center; padding:22px; z-index:70; }
  #modal.hidden { display:none; }
  #modal .box { background:#26331e; border:2px solid #56704a; border-radius:16px; padding:20px; max-width:340px; line-height:1.7; font-size:15px; }
  #modal h2 { color:#b9e08c; margin-bottom:8px; }
  #modal button { margin-top:14px; width:100%; font:inherit; font-weight:700; padding:12px; border-radius:12px; border:2px solid #56704a; background:#33452a; color:#eef4e0; }
</style>
</head>
<body>
<div id="goal"><span>めあて: <b>あいての 巣🕳️まで もりを ひろげよう</b>　数字は つよさ</span><button id="restart">はじめから</button></div>
<div id="banner"></div>
<div id="tut" class="hidden"><span id="tut-text"></span><button id="tut-skip">とばす</button></div>
<div id="board"><div id="tiles"></div><div id="units"></div></div>
<div id="modal" class="hidden"><div class="box"><h2 id="m-title"></h2><p id="m-body"></p><button onclick="location.reload()">もういちど あそぶ</button></div></div>

<script>
"use strict";

// ================= 盤 =================
const W = 9, H = 14;
const tiles = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const t = { owner: null, locked: true, sparkle: false };
  if (y >= H - 3) { t.owner = "p"; t.locked = false; }
  if (y <= 2)     { t.owner = "e"; t.locked = false; }
  tiles.push(t);
}
tiles[6 * W + 1].sparkle = true;
tiles[8 * W + 7].sparkle = true;

const idx = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const N4 = (x, y) => [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b]) => inB(a,b));

// ================= 虫と もの =================
// power: つよさ。画面にも この数字を そのまま 出す（バッジ）。
// gen:   時間で 🥚を うむ 生産拠点。interval は うむ 間隔（ミリ秒）。
// かりとり（開拓）の ちから。虫は じぶんの となりの くさむらを **かってに** かりとる。
//   ms   … 1回に かかる 時間
//   area … 1=となり1マス / "adj"=となり ぜんぶ / "3x3"=まわり ぜんぶ
// 実機テスト3回目で「アリは 自分で 森を 切りひらけない」と 分かったので、
// ドラッグしなくても 進むように した。どこに 虫を おくかで 広がる 向きを きめる。
const HARVEST = {
  worker:  { ms: 3000, area: 1 },
  soldier: { ms: 2000, area: 1 },
  major:   { ms: 2000, area: "adj" },
  kabuto:  { ms: 1500, area: "3x3" }, // 開拓の 王者。ねむりから さめる ねうちが ある
};

const SPEC = {
  egg:    { name:"たまご",           emoji:"🥚", power:0,  next:"worker" },
  worker: { name:"はたらきアリ",      emoji:"🐜", power:1,  next:"soldier" },
  soldier:{ name:"へいたいアリ",      emoji:"🐜", power:4,  next:"major" },
  major:  { name:"おおあごへいたい",  emoji:"🐜", power:16, next:null },
  kabuto: { name:"カブトムシ",        emoji:"🪲", power:30, next:null },
  dirt:   { name:"つちのやま",        emoji:"🟤", power:0,  next:"moundS" },
  moundS: { name:"アリづか",          emoji:"⛰️", power:2,  gen:"egg", interval:6000 },
  queen:  { name:"女王アリづか",      emoji:"⛰️", power:3,  gen:"egg", interval:5000, crown:true },
  nest:   { name:"外来種の 巣",       emoji:"🕳️", power:3 },
};

const units = [];
let nextId = 1;
const unitAt = (x, y) => units.find(u => u.x === x && u.y === y);
function spawn(type, side, x, y, pop = true) {
  const u = { id: nextId++, type, side, x, y, pop, nextAuto: Date.now() + (SPEC[type].interval || 0) };
  units.push(u);
  return u;
}

const queen = spawn("queen", "p", 4, H - 2, false);
const nest  = spawn("nest",  "e", 4, 1, false);
spawn("egg", "p", 3, H - 2, false);
spawn("egg", "p", 5, H - 2, false);
spawn("dirt", "p", 2, H - 1, false); // つちのやまチェーンに 最初から 気づけるように 1つ おいておく

let over = false;
let mergesDone = 0;
// かりとりの ごほうび（e2e から 変えられるように 変数に）
const drops = { egg: .4, dirt: .3 };

// ================= 音 =================
let ac = null;
function beep(freq, dur = .09, type = "triangle", gain = .12, when = 0) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  } catch { /* 音が 出なくても 遊べる */ }
}
const sndMerge = (tier) => { [0,1,2].forEach(i => beep(330 * Math.pow(1.5, tier) * (1 + i * .26), .12, "triangle", .14, i * .05)); };
const sndClaim = () => beep(880, .06, "sine", .07);
const sndFight = () => beep(120, .12, "square", .10);
const sndFind  = () => { [523,659,784,1046].forEach((f,i) => beep(f, .14, "triangle", .13, i * .07)); };
const sndPop   = () => beep(660, .07, "triangle", .1);

// ================= 見た目 =================
const tilesEl = document.getElementById("tiles");
const unitsEl = document.getElementById("units");
const bannerEl = document.getElementById("banner");
const banner = (t) => { bannerEl.textContent = t; };

function fitTile() {
  const top = document.getElementById("board").getBoundingClientRect().top;
  const availH = innerHeight - top - 12;
  const byW = Math.floor((Math.min(innerWidth, 430) - 26) / W);
  const byH = Math.floor((availH - 10 - 2 * (H - 1)) / H);
  return Math.max(22, Math.min(46, byW, byH));
}
let ts = 36;
function applyTile() {
  ts = fitTile();
  document.documentElement.style.setProperty("--ts", ts + "px");
  tilesEl.style.gridTemplateColumns = `repeat(${W}, ${ts}px)`;
}

let dragging = null;
const flash = new Set();

function draw() {
  if (dragging) return;
  tilesEl.innerHTML = "";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = tiles[idx(x, y)];
    const d = document.createElement("div");
    d.className = "tile " + (t.locked ? "locked" : (t.owner || "n")) + ((x + y) % 2 ? " alt" : "");
    if (t.sparkle && t.locked) d.classList.add("sparkle");
    if (flash.has(idx(x, y))) d.classList.add("claimflash");
    tilesEl.appendChild(d);
  }
  flash.clear();

  // 「あと1つで マージ」の 2つ組を 光らせる
  const readyIds = new Set();
  for (const u of units) {
    if (u.side !== "p" || !SPEC[u.type].next) continue;
    let n = 0;
    for (const [nx, ny] of N4(u.x, u.y)) {
      const o = unitAt(nx, ny);
      if (o && o.side === "p" && o.type === u.type) n++;
    }
    if (n === 1) readyIds.add(u.id);
  }

  unitsEl.innerHTML = "";
  for (const u of units) {
    const s = SPEC[u.type];
    const d = document.createElement("div");
    d.className = `u t-${u.type}` + (u.side === "e" ? " e" : "") + (u.pop ? " pop" : "")
      + (readyIds.has(u.id) ? " ready" : "") + (u.harvest ? " harvest" : "");
    u.pop = false;
    d.style.left = u.x * (ts + 2) + "px";
    d.style.top  = u.y * (ts + 2) + "px";
    d.textContent = s.emoji;
    if (s.power >= 1 && !s.gen && u.type !== "nest") {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = s.power;
      d.appendChild(b);
    }
    if (s.crown) {
      const c = document.createElement("span");
      c.className = "crown";
      c.textContent = "👑";
      d.appendChild(c);
    }
    d.dataset.id = u.id;
    unitsEl.appendChild(d);
  }
}

function sparks(x, y) {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = "✨";
    s.style.left = x * (ts + 2) + ts / 2 + "px";
    s.style.top  = y * (ts + 2) + ts / 2 + "px";
    s.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
    s.style.setProperty("--dy", (Math.random() * 90 - 45) + "px");
    unitsEl.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

// ================= 陣地 =================
function wakeSparkle(t, x, y, side) {
  if (!t.sparkle) return;
  t.sparkle = false;
  if (!unitAt(x, y)) {
    spawn("kabuto", side, x, y);
    sndFind();
    if (side === "p") banner("✨ カブトムシが 目を さました！ つよさ30の 一騎当千だ！");
  }
}

function claimAround(cx, cy, side) {
  for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
    if (!inB(x, y)) continue;
    const t = tiles[idx(x, y)];
    if (t.owner === (side === "p" ? "e" : "p")) continue;
    if (t.locked) { t.locked = false; wakeSparkle(t, x, y, side); }
    if (t.owner !== side) { t.owner = side; flash.add(idx(x, y)); }
  }
  sndClaim();
}

// ================= マージ =================
function mergeCheck(u) {
  const next = SPEC[u.type].next;
  if (!next) return false;

  const group = [];
  const seen = new Set([u.id]);
  const q = [u];
  while (q.length) {
    const c = q.pop();
    group.push(c);
    for (const [nx, ny] of N4(c.x, c.y)) {
      const o = unitAt(nx, ny);
      if (o && !seen.has(o.id) && o.side === u.side && o.type === u.type) { seen.add(o.id); q.push(o); }
    }
  }
  if (group.length < 3) return false;

  const five = group.length >= 5;
  const used = [u, ...group.filter(g => g !== u).slice(0, five ? 4 : 2)];
  for (const g of used) units.splice(units.indexOf(g), 1);

  const born = [spawn(next, u.side, u.x, u.y)];
  if (five) {
    const spot = used.find(g => g !== u && !unitAt(g.x, g.y));
    born.push(spawn(next, u.side, spot ? spot.x : u.x, spot ? spot.y : u.y));
  }

  const tier = { worker: 1, soldier: 2, major: 3, moundS: 2 }[next] || 1;
  sndMerge(tier);
  sparks(u.x, u.y);
  claimAround(u.x, u.y, u.side);
  mergesDone++;

  if (u.side === "p") {
    const ns = SPEC[next];
    if (next === "moundS") {
      banner("⛰️ アリづかが できた！ じかんで 🥚を うんでくれる。づかが ふえるほど 増産だ！");
      tutEvent("mound");
    } else {
      banner(five
        ? `⭐ 5つマージ！ ${ns.name}（つよさ${ns.power}）が 2体も うまれた！`
        : `${ns.name}に なった！ つよさ${ns.power}。もりも ひろがったよ。`);
    }
    tutEvent("merge");
  }
  for (const b of born) mergeCheck(b);
  return true;
}

// ================= かりとり（くさむらを へらす） =================
// 虫は となりに くさむらが あれば **かってに** かりとる。ドラッグは 向きを きめる ためのもの。
function canHarvest(u) {
  return HARVEST[u.type] && u.side === "p";
}
function grassNextTo(x, y) {
  return N4(x, y).filter(([a, b]) => tiles[idx(a, b)].locked);
}

function openTile(x, y, side) {
  const t = tiles[idx(x, y)];
  if (!t.locked && t.owner === side) return false;
  t.locked = false;
  t.owner = side;
  flash.add(idx(x, y));
  wakeSparkle(t, x, y, side);
  return true;
}

function finishHarvest(u) {
  const area = HARVEST[u.type].area;
  let opened = 0;
  if (area === 1) {
    const g = grassNextTo(u.x, u.y);
    const t = u.aim && tiles[idx(u.aim.x, u.aim.y)].locked ? [u.aim.x, u.aim.y] : g[0];
    if (t) opened += openTile(t[0], t[1], "p") ? 1 : 0;
  } else if (area === "adj") {
    for (const [a, b] of grassNextTo(u.x, u.y)) opened += openTile(a, b, "p") ? 1 : 0;
  } else {
    for (let y = u.y - 1; y <= u.y + 1; y++) for (let x = u.x - 1; x <= u.x + 1; x++) {
      if (inB(x, y) && tiles[idx(x, y)].locked) opened += openTile(x, y, "p") ? 1 : 0;
    }
  }
  u.aim = null;
  if (!opened) return;

  sndClaim();
  sparks(u.x, u.y);
  stepForward(u);

  // ごほうび: くさむらの 中から 🥚や 🟤が 見つかる
  const spot = N4(u.x, u.y).find(([a, b]) => {
    const tt = tiles[idx(a, b)];
    return !tt.locked && tt.owner === "p" && !unitAt(a, b);
  });
  if (spot) {
    const r = Math.random();
    if (r < drops.egg) { spawn("egg", "p", ...spot); banner("🌿の 中から 🥚を 見つけた！"); sndPop(); }
    else if (r < drops.egg + drops.dirt) { spawn("dirt", "p", ...spot); banner("🌿の 中から 🟤つちのやまを 見つけた！ 3つ あつめると…"); sndPop(); }
  }
  tutEvent("harvest");
}

// かりとりが おわったら、いちばん 近い くさむらの ほうへ 1マス すすむ。
//
// これが ないと、となりを 刈りおえた虫は その場で 止まり、二度と 前に すすまない。
// 実機テスト3回目の「アリは 自分で 森を 切りひらけない」は、じつは
// ここが 抜けていたのが 本体だった（1マスは 刈れても 前線が 動かない）。
// 虫は じぶんで すすむ。プレイヤーは「どこに おくか」で 向きを きめる。
function stepForward(u) {
  if (grassNextTo(u.x, u.y).length) return; // まだ となりに 草が あるなら 動かない

  // いちばん 近い くさむらを さがす
  let best = null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!tiles[idx(x, y)].locked) continue;
    const d = Math.abs(x - u.x) + Math.abs(y - u.y);
    if (!best || d < best.d) best = { x, y, d };
  }
  if (!best) return;

  // じぶんの 陣地の 中を、草に 近づく ほうへ 1マス
  const cands = N4(u.x, u.y).filter(([x, y]) => {
    const t = tiles[idx(x, y)];
    return !t.locked && t.owner === "p" && !unitAt(x, y);
  });
  if (!cands.length) return;
  cands.sort((a, b) =>
    (Math.abs(a[0] - best.x) + Math.abs(a[1] - best.y)) - (Math.abs(b[0] - best.x) + Math.abs(b[1] - best.y)));
  const [nx, ny] = cands[0];
  if (Math.abs(nx - best.x) + Math.abs(ny - best.y) >= best.d) return; // 近づかないなら 動かない
  u.x = nx; u.y = ny;
}

// 400ミリ秒ごとに、となりに くさむらが ある虫を もぐもぐ させる
setInterval(() => {
  if (over) return;
  const now = Date.now();
  let changed = false;

  for (const u of units) {
    if (!canHarvest(u)) continue;
    if (dragging && dragging.u === u) { u.harvest = false; u.until = 0; continue; }

    if (u.harvest) {
      if (now >= u.until) { finishHarvest(u); u.harvest = false; changed = true; }
      continue;
    }
    if (grassNextTo(u.x, u.y).length) {
      u.harvest = true;
      u.until = now + HARVEST[u.type].ms;
      changed = true;
    } else {
      // 草が となりに 無ければ 前線へ 歩く（マージの じゃまに ならない よう ゆっくり）
      if (!u.walkAt || now >= u.walkAt) {
        const before = u.x + "," + u.y;
        stepForward(u);
        u.walkAt = now + 1200;
        if (before !== u.x + "," + u.y) changed = true;
      }
    }
  }
  if (changed) draw();
}, 400);

// ================= そうさ =================
const ghost = document.createElement("div");
ghost.id = "ghost";

document.addEventListener("pointerdown", (ev) => {
  if (over) return;
  if (!ac) beep(1, .01, "sine", .001);
  const el = ev.target.closest(".u");
  if (!el) return;
  const u = units.find(x => x.id === +el.dataset.id);
  if (!u || u.side !== "p") return;

  if (SPEC[u.type].gen) { tapGen(u); return; }
  u.harvest = false; u.aim = null;

  dragging = { u, el };
  el.style.opacity = ".25";
  ghost.textContent = SPEC[u.type].emoji;
  document.body.appendChild(ghost);
  moveGhost(ev);
});
document.addEventListener("pointermove", (ev) => { if (dragging) moveGhost(ev); });
function moveGhost(ev) { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; }

document.addEventListener("pointerup", (ev) => {
  if (!dragging) return;
  const { u, el } = dragging;
  dragging = null;
  ghost.remove();
  el.style.opacity = "";

  const r = tilesEl.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / (ts + 2));
  const y = Math.floor((ev.clientY - r.top) / (ts + 2));
  if (inB(x, y) && !unitAt(x, y)) {
    const t = tiles[idx(x, y)];
    if (!t.locked && t.owner !== "e") {
      u.x = x; u.y = y;
      if (!mergeCheck(u)) beep(440, .04, "sine", .05);
    } else if (t.locked && canHarvest(u)) {
      // くさむらの となりに じぶんの 陣地が あれば、そこへ 出て かりとりを はじめる。
      // すでに となりに 立っているなら 動かない（足場を 自分で ふさいで しまうため）。
      const already = N4(x, y).some(([a, b]) => a === u.x && b === u.y);
      const foot = already ? [u.x, u.y]
        : N4(x, y).find(([a, b]) => { const tt = tiles[idx(a, b)]; return !tt.locked && tt.owner === "p" && !unitAt(a, b); });
      if (foot) {
        u.x = foot[0]; u.y = foot[1];
        u.aim = { x, y };
        u.harvest = true;
        u.until = Date.now() + Math.round(HARVEST[u.type].ms * .6); // ねらった ぶん すこし はやい
        banner("もぐもぐ… 🌿を かりとりちゅう。");
      } else {
        banner("そこは まだ とおいよ。じぶんの みどりの となりから ひろげよう。");
      }
    } else if (t.owner === "e") {
      banner("そこは あいての 陣地。虫を ならべて おいはらおう。");
    }
  }
  draw();
});

let genCool = 0;
function tapGen(g) {
  const now = Date.now();
  if (now < genCool) return;
  if (!tryProduce(g)) { banner("づかの まわりが いっぱいだよ。アリを うごかして あけよう。"); return; }
  genCool = now + 900;
  sndPop();
  tutEvent("egg");
  draw();
}

// づかの 生産（タップでも 時間でも ここを 通る）
function tryProduce(g) {
  if (units.filter(u => u.side === "p" && u.type === "egg").length >= 8) return false;
  const spots = N4(g.x, g.y).filter(([x, y]) => {
    const t = tiles[idx(x, y)];
    return !t.locked && t.owner === g.side && !unitAt(x, y);
  });
  if (!spots.length) return false;
  spawn("egg", g.side, ...spots[Math.floor(Math.random() * spots.length)]);
  return true;
}

// ================= 時間で うごくもの =================
// 増産: づかは さわらなくても 🥚を うみつづける（Merge Dragons の 生産の 手ざわり）
setInterval(() => {
  if (over) return;
  let made = false;
  const now = Date.now();
  for (const g of units.filter(u => u.side === "p" && SPEC[u.type].gen)) {
    if (now >= g.nextAuto) {
      g.nextAuto = now + SPEC[g.type].interval;
      if (tryProduce(g)) made = true;
    }
  }
  if (made) { sndPop(); draw(); }
}, 700);

// 外来種の ばん
let enemyStep = 0;
setInterval(() => {
  if (over) return;
  enemyStep++;

  const cap = 5 + Math.floor(enemyStep / 8);
  const kids = units.filter(u => u.side === "e" && SPEC[u.type].power > 0 && u.type !== "nest");
  if (kids.length < cap) {
    const spots = N4(nest.x, nest.y).filter(([x, y]) => !tiles[idx(x, y)].locked && !unitAt(x, y));
    if (spots.length) spawn("worker", "e", ...spots[Math.floor(Math.random() * spots.length)]);
  }

  for (const u of kids) if (mergeCheck(u)) break;

  if (enemyStep < 8 || (mergesDone === 0 && enemyStep < 20)) { draw(); return; }
  // 敵が 新しく ひらける くさむらは 1回に 1マスまで。
  // ここを 3マスに していたので、60秒 放置で 敵 +6 / 味方 +0 という
  // 不公平に なっていた（実機テスト3回目のご指摘）。
  let openedByEnemy = 0;
  const walkers = kids.sort((a, b) => b.y - a.y).slice(0, 3);
  for (const u of walkers) {
    const cands = N4(u.x, u.y)
      .filter(([x, y]) => {
        if (unitAt(x, y) || tiles[idx(x, y)].owner === "p") return false;
        if (tiles[idx(x, y)].locked && openedByEnemy >= 1) return false; // 開拓は 1マスまで
        return true;
      })
      .sort((a, b) => (Math.abs(a[0] - queen.x) + Math.abs(a[1] - queen.y)) - (Math.abs(b[0] - queen.x) + Math.abs(b[1] - queen.y)));
    if (!cands.length) continue;
    const [x, y] = cands[0];
    const t = tiles[idx(x, y)];
    if (t.locked) { t.locked = false; openedByEnemy++; wakeSparkle(t, x, y, "e"); }
    t.owner = "e";
    u.x = x; u.y = y;
  }
  draw();
}, 2600);

// あらそい
setInterval(() => {
  if (over) return;
  let fought = false;

  for (const p of [...units]) {
    if (p.side !== "p" || !units.includes(p)) continue;
    const foe = N4(p.x, p.y).map(([x, y]) => unitAt(x, y)).find(o => o && o.side === "e");
    if (!foe) continue;

    const cluster = (start) => {
      const g = [], seen = new Set([start.id]), q = [start];
      while (q.length) {
        const c = q.pop();
        g.push(c);
        for (const [nx, ny] of N4(c.x, c.y)) {
          const o = unitAt(nx, ny);
          if (o && !seen.has(o.id) && o.side === start.side) { seen.add(o.id); q.push(o); }
        }
      }
      return g;
    };
    const mine = cluster(p), yours = cluster(foe);
    const sum = (g) => g.reduce((a, u) => a + SPEC[u.type].power, 0);
    const pSum = sum(mine), eSum = sum(yours);
    const pMax = Math.max(...mine.map(u => SPEC[u.type].power));
    const eMax = Math.max(...yours.map(u => SPEC[u.type].power));

    const kill = (side, all) => {
      const g = side === "e" ? yours : mine;
      const targets = all ? g : [g.filter(u => !SPEC[u.type].gen && u.type !== "nest").sort((a, b) => SPEC[a.type].power - SPEC[b.type].power)[0] || g[0]];
      for (const t of targets) {
        if (!units.includes(t)) continue;
        units.splice(units.indexOf(t), 1);
        tiles[idx(t.x, t.y)].owner = side === "e" ? "p" : "e";
        flash.add(idx(t.x, t.y));
      }
    };

    fought = true;
    if (pMax >= eSum && pSum > eSum) { kill("e", true); banner("💥 格が うえだ！ まとめて おいはらった！"); }
    else if (eMax >= pSum && eSum > pSum) { kill("p", true); }
    else if (pSum > eSum) kill("e", false);
    else if (eSum > pSum) kill("p", false);
    else { kill("e", false); kill("p", false); }
    break;
  }

  if (fought) { sndFight(); tutEvent("fight"); checkEnd(); draw(); }
}, 1600);

function checkEnd() {
  if (over) return;
  if (!units.includes(nest)) {
    over = true;
    showEnd("もりを とりもどした！ 🎉", "外来種の 巣まで たどりついた。むしは 群れの力で すみかを まもれるんだ。");
  } else if (!units.includes(queen)) {
    over = true;
    showEnd("女王アリづかが…", "外来種に すみかを うばわれてしまった。アリづかを ふやして、へいたいを はやめに そだてよう。");
  }
}
function showEnd(t, b) {
  document.getElementById("m-title").textContent = t;
  document.getElementById("m-body").textContent = b;
  document.getElementById("modal").classList.remove("hidden");
}

// ================= チュートリアル =================
const tutEl = document.getElementById("tut");
const TUT = [
  { text: "👑⛰️を タップ → 🥚が うまれる。づかは じかんでも かってに 🥚を うむよ。", done: (e) => e === "egg" },
  { text: "🥚を ドラッグして 3つ ならべよう。3つで 🐜、5つ ならべると 2体 うまれて おとく！", done: (e) => e === "merge" },
  { text: "🐜を 🌿くさむらの そばに おこう。**かってに かりとって** もりが ひろがるよ。🥚や 🟤も 見つかる！", done: (e) => e === "harvest" },
  { text: "🟤つちのやまを 3つ あつめると ⛰️アリづか！ づかが ふえるほど 🥚の 増産が はやくなる。", done: (e) => e === "mound", timeout: 25000 },
  { text: "🐜も 3つで 上の 格に！ 格が 上がると かりとりも はやく 広くなる。✨には 🪲カブトムシが ねむっているよ。", done: () => false, timeout: 12000 },
];
let tutStep = 0;
function showTut() {
  if (tutStep >= TUT.length) { tutEl.classList.add("hidden"); applyTile(); draw(); return; }
  document.getElementById("tut-text").textContent = TUT[tutStep].text;
  tutEl.classList.remove("hidden");
  const my = tutStep;
  if (TUT[my].timeout) setTimeout(() => { if (tutStep === my) { tutStep++; showTut(); } }, TUT[my].timeout);
}
function tutEvent(e) {
  if (tutStep >= TUT.length) return;
  if (TUT[tutStep].done(e)) { tutStep++; showTut(); }
}
document.getElementById("tut-skip").addEventListener("click", () => { tutStep = TUT.length; showTut(); });
document.getElementById("restart").addEventListener("click", () => location.reload());

banner("むらさきの 外来種から、みどりの もりを とりもどそう。");
showTut();
applyTile();
draw();
addEventListener("resize", () => { applyTile(); draw(); });

if (new URLSearchParams(location.search).has("e2e")) {
  window.__e2e = { units, tiles, spawn, mergeCheck, unitAt, W, H, queen, nest, drops, draw,
    get over() { return over; }, get merges() { return mergesDone; } };
}
</script>
