<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昆虫戦争 マップエディタ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #14200f; color: #f2f4ee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; background: #22301c; border-bottom: 2px solid #0d150a;
  }
  h1 { font-size: 16px; margin: 0; }
  .wrap { display: flex; gap: 14px; padding: 12px; align-items: flex-start; flex-wrap: wrap; }
  .col { flex: 1 1 320px; min-width: 300px; }
  canvas { background: #0d150a; border-radius: 8px; touch-action: none; max-width: 100%; }
  button, select, input {
    font-family: inherit; font-size: 13px; color: #f2f4ee;
    background: #3a4436; border: 1px solid #4d5a47; border-radius: 8px;
    padding: 7px 10px; cursor: pointer;
  }
  button:hover { background: #4a7c3f; }
  button.primary { background: #4a7c3f; }
  input[type=text], input[type=number] { background: #1c2717; cursor: text; }
  fieldset { border: 1px solid #3d5133; border-radius: 10px; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: #a9c79c; font-size: 12px; padding: 0 6px; }
  .brushes { display: flex; flex-wrap: wrap; gap: 6px; }
  .brush {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 9px; border-radius: 8px; border: 2px solid transparent;
    background: #2b3a24; cursor: pointer; font-size: 12px;
  }
  .brush.on { border-color: #f5d97a; background: #3d5133; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .meta label { color: #a9c79c; font-size: 12px; }
  .meta input { width: 100%; }
  textarea {
    width: 100%; height: 260px; background: #0d150a; color: #cfe3c4;
    border: 1px solid #3d5133; border-radius: 8px; padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5;
  }
  #report { font-size: 12.5px; line-height: 1.75; }
  #report .ng { color: #ff9080; }
  #report .ok { color: #9fdc8c; }
  #report .warn { color: #f5d97a; }
  .hint { color: #8fa387; font-size: 12px; line-height: 1.7; }
</style>

<header>
  <h1>🐛 マップエディタ</h1>
  <select id="load"></select>
  <button id="btn-load">読みこむ</button>
  <button id="btn-new">まっさら</button>
  <span style="flex:1"></span>
  <button id="btn-check">検査する</button>
  <button id="btn-export" class="primary">maps.js の形で 出す</button>
</header>

<div class="wrap">
  <div class="col" style="flex:0 0 auto">
    <canvas id="cv"></canvas>
    <p class="hint">
      マスを ドラッグすると 続けて 塗れる。<br>
      虫ブラシで 虫の いるマスを タップすると 消える。
    </p>
  </div>

  <div class="col">
    <fieldset>
      <legend>ステージの情報</legend>
      <div class="meta">
        <label>id</label><input type="text" id="m-id" placeholder="w2s1">
        <label>世界 / 面</label>
        <span><input type="number" id="m-world" min="1" max="8" style="width:64px"> −
              <input type="number" id="m-stage" min="1" max="10" style="width:64px"></span>
        <label>名まえ</label><input type="text" id="m-name">
        <label>ひとこと</label><input type="text" id="m-hint">
        <label>AI</label><input type="number" id="m-ai" min="1" max="3" style="width:64px">
        <label>はじめの お金</label>
        <span>あお <input type="number" id="m-funds-p" step="1000" style="width:88px">
              あか <input type="number" id="m-funds-e" step="1000" style="width:88px"></span>
        <label>大きさ</label>
        <span><input type="number" id="m-w" min="4" max="24" style="width:64px"> ×
              <input type="number" id="m-h" min="4" max="24" style="width:64px">
              <button id="btn-resize">かえる</button></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>地形</legend>
      <div class="brushes" id="terrain-brushes"></div>
    </fieldset>

    <fieldset>
      <legend>もちぬし（占領できる地形に つける）</legend>
      <div class="brushes" id="owner-brushes"></div>
    </fieldset>

    <fieldset>
      <legend>虫</legend>
      <div class="brushes" id="unit-brushes"></div>
    </fieldset>

    <fieldset>
      <legend>検査</legend>
      <div id="report" class="hint">「検査する」を おすと ここに 出ます。</div>
    </fieldset>
  </div>

  <div class="col">
    <fieldset>
      <legend>maps.js に 貼るもの</legend>
      <textarea id="out" readonly></textarea>
      <button id="btn-copy" style="margin-top:8px">コピー</button>
    </fieldset>
  </div>
</div>

<script type="module">
import { TERRAIN, CHAR_TO_TERRAIN } from '../js/data/terrain.js';
import { UNITS } from '../js/data/units.js';
import { MAPS } from '../js/data/maps.js';
import { Game } from '../js/engine.js';
import { AI } from '../js/ai.js';

const TERRAIN_CHARS = Object.entries(CHAR_TO_TERRAIN);
const TILE = 34;

// ---- じょうたい ----
let map = blankMap(10, 10);
let brush = { kind: 'terrain', value: '.' };

function blankMap(w, h) {
  return {
    id: '', world: 2, stage: 1, name: '', hint: '',
    aiLevel: 1, startFunds: 0, incomePerProperty: 1000,
    rows: Array.from({ length: h }, () => '.'.repeat(w)),
    owners: [], units: [], steps: [],
  };
}

const width = () => map.rows[0].length;
const height = () => map.rows.length;

function charAt(x, y) { return map.rows[y][x]; }
function setChar(x, y, ch) {
  const row = [...map.rows[y]];
  row[x] = ch;
  map.rows[y] = row.join('');
  // 占領できない地形に なったら もちぬしも 消す
  if (!TERRAIN[CHAR_TO_TERRAIN[ch]].capturable) {
    map.owners = map.owners.filter((o) => !(o.x === x && o.y === y));
  }
}
const ownerAt = (x, y) => map.owners.find((o) => o.x === x && o.y === y) || null;
const unitAt = (x, y) => map.units.find((u) => u.x === x && u.y === y) || null;

// ---- ブラシ ----
function buildBrushes() {
  const t = document.getElementById('terrain-brushes');
  t.innerHTML = '';
  for (const [ch, id] of TERRAIN_CHARS) {
    t.appendChild(brushButton(
      { kind: 'terrain', value: ch },
      `<span class="swatch" style="background:${TERRAIN[id].color}"></span>${TERRAIN[id].name}<b style="opacity:.5">${ch}</b>`
    ));
  }

  const o = document.getElementById('owner-brushes');
  o.innerHTML = '';
  for (const [team, label, color] of [
    ['player', 'あお（自分）', '#4a90e2'],
    ['enemy', 'あか（敵）', '#e2564a'],
    [null, 'ちゅうりつ', '#888'],
  ]) {
    o.appendChild(brushButton(
      { kind: 'owner', value: team },
      `<span class="swatch" style="background:${color}"></span>${label}`
    ));
  }

  const u = document.getElementById('unit-brushes');
  u.innerHTML = '';
  for (const team of ['player', 'enemy']) {
    for (const spec of Object.values(UNITS)) {
      u.appendChild(brushButton(
        { kind: 'unit', value: spec.id, team },
        `<span class="swatch" style="background:${team === 'player' ? '#4a90e2' : '#e2564a'}"></span>${spec.icon}${spec.name}`
      ));
    }
  }
  markBrush();
}

function brushButton(b, html) {
  const el = document.createElement('div');
  el.className = 'brush';
  el.innerHTML = html;
  el.dataset.key = brushKey(b);
  el.addEventListener('click', () => { brush = b; markBrush(); });
  return el;
}
const brushKey = (b) => `${b.kind}:${b.value}:${b.team || ''}`;
function markBrush() {
  const key = brushKey(brush);
  document.querySelectorAll('.brush').forEach((el) => el.classList.toggle('on', el.dataset.key === key));
}

// ---- えがく ----
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function draw() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = width() * TILE * dpr;
  cv.height = height() * TILE * dpr;
  cv.style.width = `${width() * TILE}px`;
  cv.style.height = `${height() * TILE}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  for (let y = 0; y < height(); y++) {
    for (let x = 0; x < width(); x++) {
      const terrain = TERRAIN[CHAR_TO_TERRAIN[charAt(x, y)]];
      ctx.fillStyle = terrain.color;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.strokeRect(x * TILE + 0.5, y * TILE + 0.5, TILE - 1, TILE - 1);

      const owner = ownerAt(x, y);
      if (owner) {
        ctx.strokeStyle = owner.team === 'player' ? '#4a90e2' : '#e2564a';
        ctx.lineWidth = 3;
        ctx.strokeRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
        ctx.lineWidth = 1;
      } else if (terrain.capturable) {
        // 中立の 占領地は 見のがしやすいので 点線で 出す
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = '#fff8';
        ctx.strokeRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
        ctx.setLineDash([]);
      }

      const unit = unitAt(x, y);
      if (unit) {
        ctx.fillStyle = unit.team === 'player' ? '#4a90e2cc' : '#e2564acc';
        ctx.fillRect(x * TILE + 4, y * TILE + 4, TILE - 8, TILE - 8);
        ctx.font = `${Math.round(TILE * 0.5)}px system-ui, "Apple Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(UNITS[unit.type].icon, (x + 0.5) * TILE, (y + 0.55) * TILE);
      }
    }
  }
  syncMeta();
  exportText();
}

// ---- 入力 ----
let painting = false;
let lastPainted = '';

function tileFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return {
    x: Math.floor((p.clientX - r.left) / TILE),
    y: Math.floor((p.clientY - r.top) / TILE),
  };
}

function paint(x, y) {
  if (x < 0 || y < 0 || x >= width() || y >= height()) return;
  const k = `${x},${y}`;
  if (k === lastPainted) return; // ドラッグ中の 同じマスへの 連打を ふせぐ
  lastPainted = k;

  if (brush.kind === 'terrain') {
    setChar(x, y, brush.value);
  } else if (brush.kind === 'owner') {
    if (!TERRAIN[CHAR_TO_TERRAIN[charAt(x, y)]].capturable) return;
    map.owners = map.owners.filter((o) => !(o.x === x && o.y === y));
    if (brush.value) map.owners.push({ x, y, team: brush.value });
  } else {
    const existing = unitAt(x, y);
    map.units = map.units.filter((u) => !(u.x === x && u.y === y));
    // 同じ虫を 置きなおしたら 消す（けしゴムを 別に 用意しなくてよい）
    if (!existing || existing.type !== brush.value || existing.team !== brush.team) {
      map.units.push({ x, y, type: brush.value, team: brush.team });
    }
  }
  draw();
}

for (const [down, move, up] of [['mousedown', 'mousemove', 'mouseup'], ['touchstart', 'touchmove', 'touchend']]) {
  cv.addEventListener(down, (e) => {
    e.preventDefault();
    painting = true;
    lastPainted = '';
    const t = tileFromEvent(e);
    paint(t.x, t.y);
  });
  cv.addEventListener(move, (e) => {
    if (!painting) return;
    e.preventDefault();
    const t = tileFromEvent(e);
    paint(t.x, t.y);
  });
  window.addEventListener(up, () => { painting = false; });
}

// ---- ステージの情報 ----
const fields = {
  'm-id': 'id', 'm-world': 'world', 'm-stage': 'stage', 'm-name': 'name',
  'm-hint': 'hint', 'm-ai': 'aiLevel',
};

// はじめの お金は 数1つ でも { player, enemy } でも よい（engine.js 参照）。
// エディタでは いつも 2つに ほぐして あつかい、同じ数なら 1つに まとめて 出す。
const fundsOf = (team) => {
  const f = map.startFunds || 0;
  return typeof f === 'number' ? f : (f[team] || 0);
};
for (const [elId, team] of [['m-funds-p', 'player'], ['m-funds-e', 'enemy']]) {
  document.getElementById(elId).addEventListener('input', () => {
    const p = Number(document.getElementById('m-funds-p').value) || 0;
    const e = Number(document.getElementById('m-funds-e').value) || 0;
    map.startFunds = p === e ? p : { player: p, enemy: e };
    exportText();
  });
}
for (const [elId, key] of Object.entries(fields)) {
  document.getElementById(elId).addEventListener('input', (e) => {
    const v = e.target.type === 'number' ? Number(e.target.value) : e.target.value;
    map[key] = v;
    exportText();
  });
}
function syncMeta() {
  for (const [elId, key] of Object.entries(fields)) document.getElementById(elId).value = map[key] ?? '';
  document.getElementById('m-funds-p').value = fundsOf('player');
  document.getElementById('m-funds-e').value = fundsOf('enemy');
  document.getElementById('m-w').value = width();
  document.getElementById('m-h').value = height();
}

document.getElementById('btn-resize').addEventListener('click', () => {
  const w = Number(document.getElementById('m-w').value);
  const h = Number(document.getElementById('m-h').value);
  if (!(w >= 4 && h >= 4 && w <= 24 && h <= 24)) return;
  const rows = [];
  for (let y = 0; y < h; y++) {
    const old = map.rows[y] || '';
    rows.push((old + '.'.repeat(w)).slice(0, w));
  }
  map.rows = rows;
  // はみ出した ものを 落とす
  map.owners = map.owners.filter((o) => o.x < w && o.y < h);
  map.units = map.units.filter((u) => u.x < w && u.y < h);
  draw();
});

// ---- 読みこみ ----
const loadSel = document.getElementById('load');
loadSel.innerHTML = MAPS.map((m) => `<option value="${m.id}">${m.id}　${m.name}</option>`).join('');
document.getElementById('btn-load').addEventListener('click', () => {
  const src = MAPS.find((m) => m.id === loadSel.value);
  if (!src) return;
  map = JSON.parse(JSON.stringify(src));
  map.owners ||= [];
  map.units ||= [];
  map.steps ||= [];
  draw();
});
document.getElementById('btn-new').addEventListener('click', () => {
  map = blankMap(12, 12);
  draw();
});

// ---- 出力 ----
// maps.js に そのまま 貼れる 形で 出す。エディタ用の 別形式は つくらない。
function exportText() {
  const q = (s) => `'${String(s).replace(/'/g, "\\'")}'`;
  const lines = [];
  lines.push('  {');
  lines.push(`    id: ${q(map.id)},`);
  lines.push(`    world: ${map.world},`);
  lines.push(`    stage: ${map.stage},`);
  lines.push(`    name: ${q(map.name)},`);
  lines.push(`    hint: ${q(map.hint)},`);
  lines.push(`    aiLevel: ${map.aiLevel},`);
  lines.push(
    typeof map.startFunds === 'object'
      ? `    startFunds: { player: ${map.startFunds.player}, enemy: ${map.startFunds.enemy} },`
      : `    startFunds: ${map.startFunds},`
  );
  lines.push(`    incomePerProperty: ${map.incomePerProperty ?? 1000},`);
  lines.push('    rows: [');
  for (const row of map.rows) lines.push(`      ${q(row)},`);
  lines.push('    ],');

  const sorted = (a) => [...a].sort((p, r) => p.y - r.y || p.x - r.x);
  lines.push('    owners: [');
  for (const o of sorted(map.owners)) lines.push(`      { x: ${o.x}, y: ${o.y}, team: ${q(o.team)} },`);
  lines.push('    ],');
  lines.push('    units: [');
  for (const u of sorted(map.units)) lines.push(`      { x: ${u.x}, y: ${u.y}, type: ${q(u.type)}, team: ${q(u.team)} },`);
  lines.push('    ],');
  if (map.steps?.length) {
    lines.push('    steps: [');
    for (const s of map.steps) lines.push(`      { on: ${q(s.on)}, text: ${q(s.text)} },`);
    lines.push('    ],');
  }
  lines.push('  },');
  document.getElementById('out').value = lines.join('\n');
}

document.getElementById('btn-copy').addEventListener('click', async () => {
  const ta = document.getElementById('out');
  try {
    await navigator.clipboard.writeText(ta.value);
  } catch {
    ta.removeAttribute('readonly');
    ta.select();
    document.execCommand('copy');
    ta.setAttribute('readonly', '');
  }
});

// ---- 検査 ----
// engine の 検証を そのまま つかい、そのうえで 遊べるかどうかまで 見る。
// 「読みこめる」だけでは 足りない。行き止まりの 面や 終わらない面が できる。
document.getElementById('btn-check').addEventListener('click', () => {
  const out = [];
  const ng = (t) => out.push(`<div class="ng">✗ ${t}</div>`);
  const ok = (t) => out.push(`<div class="ok">✓ ${t}</div>`);
  const warn = (t) => out.push(`<div class="warn">! ${t}</div>`);

  let game;
  try {
    game = new Game(map);
    ok('マップとして 読みこめる');
  } catch (e) {
    ng(e.message);
    document.getElementById('report').innerHTML = out.join('');
    return;
  }

  if (!map.id) ng('id が 空');
  if (MAPS.some((m) => m.id === map.id)) {
    warn(`id "${map.id}" は すでに maps.js に ある。直しているなら そのまま 置きかえる。新しい面なら id を 変える`);
  }

  for (const team of ['player', 'enemy']) {
    const hq = [...game.props.values()].filter((p) => game.terrainAt(p.x, p.y).hq && p.team === team);
    if (hq.length === 1) ok(`${team === 'player' ? 'あお' : 'あか'}の 女王の巣が 1つ`);
    else ng(`${team === 'player' ? 'あお' : 'あか'}の 女王の巣が ${hq.length}個（1つに する）`);

    const units = map.units.filter((u) => u.team === team);
    if (!units.length) ng(`${team === 'player' ? 'あお' : 'あか'}の 虫が 1体も いない`);
  }

  const seen = new Set();
  for (const u of map.units) {
    const k = `${u.x},${u.y}`;
    if (seen.has(k)) ng(`(${k}) に 虫が かさなっている`);
    seen.add(k);
    const cost = game.terrainAt(u.x, u.y).move[UNITS[u.type].moveType];
    if (cost == null) ng(`${UNITS[u.type].name} が 入れない ${game.terrainAt(u.x, u.y).name} に いる (${k})`);
    const world = map.world || 99;
    if ((UNITS[u.type].fromWorld || 1) > world) {
      warn(`${UNITS[u.type].name} は 世界${UNITS[u.type].fromWorld}から の虫（この面は 世界${world}）`);
    }
  }
  if (!out.some((l) => l.includes('かさなって'))) ok('虫が かさなっていない');

  // 敵の 女王の巣まで 歩いて 行けるか。行けないと クリア できない。
  const enemyHQ = [...game.props.values()].find((p) => game.terrainAt(p.x, p.y).hq && p.team === 'enemy');
  const start = map.units.find((u) => u.team === 'player');
  if (enemyHQ && start) {
    const reach = walkReach(game, start);
    if (reach.has(`${enemyHQ.x},${enemyHQ.y}`)) ok('あおの 虫が 敵の 女王の巣まで 行ける');
    else ng('あおの 虫が 敵の 女王の巣まで たどりつけない（岩場や 池で ふさがれている）');
  }

  const ownerless = [...game.props.values()].filter((p) => !p.team).length;
  ok(`占領できる場所 ${game.props.size}個（うち ちゅうりつ ${ownerless}個）`);

  // AI どうしで 回して、ほんとうに 終わるかを 見る
  let finished = 0;
  let turns = [];
  for (let i = 0; i < 5; i++) {
    const g = new Game(map);
    const red = new AI(g, map.aiLevel || 1);
    const blue = new AI(g, map.aiLevel || 1);
    blue.team = 'player';
    for (let t = 0; t < 60 && g.status === 'playing'; t++) {
      const actor = g.turnTeam === 'enemy' ? red : blue;
      let guard = 0;
      while (actor.takeOneAction() && guard++ < 200);
      actor.produce();
      if (g.status !== 'playing') break;
      g.endTurn();
    }
    if (g.status !== 'playing') { finished++; turns.push(g.turnCount); }
  }
  if (finished >= 3) {
    const avg = Math.round(turns.reduce((a, b) => a + b, 0) / turns.length);
    ok(`AI どうしで ${finished}/5回 決着（へいきん ${avg}ターン）`);
    if (avg <= 3) warn('かんたん すぎるかも（へいきん 3ターン いか）');
    if (avg >= 25) warn('長すぎるかも（へいきん 25ターン いじょう）');
  } else {
    ng(`AI どうしで ${finished}/5回しか 決着しない（手づまりに なる面）`);
  }

  document.getElementById('report').innerHTML = out.join('');
});

// 歩く虫が 行ける はんい（移動力は 見ない。つながっているかだけ）
function walkReach(game, startUnit) {
  const moveType = UNITS[startUnit.type].moveType;
  const seen = new Set([`${startUnit.x},${startUnit.y}`]);
  const queue = [[startUnit.x, startUnit.y]];
  while (queue.length) {
    const [x, y] = queue.shift();
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx < 0 || ny < 0 || nx >= width() || ny >= height()) continue;
      const k = `${nx},${ny}`;
      if (seen.has(k)) continue;
      if (game.terrainAt(nx, ny).move[moveType] == null) continue;
      seen.add(k);
      queue.push([nx, ny]);
    }
  }
  return seen;
}
