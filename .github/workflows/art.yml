name: グラフィックの受け入れ

# グラフィック担当（ChatGPT / Codex）が絵を push したら自動で動く。
# 1. 仕様どおりかを検査する（透過・サイズ・占有率・余白）
# 2. manifest.json を作り直してコミットする
# → 人間が manifest を手で書いたり、目視で1枚ずつ確認したりしなくてよくなる。

on:
  push:
    paths:
      - 'game/assets/units/**'
      - 'game/art/orders.json'
      - 'scripts/**'
  pull_request:
    paths:
      - 'game/assets/units/**'
      - 'game/art/orders.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: manifest.json を作り直し、届いたぶんの status をそろえる
        run: node scripts/build-manifest.mjs

      - name: 更新された manifest と orders をコミット
        # PR 側のブランチに直接書き戻す。fork からの PR では書き込めないので、
        # そのときは検査だけ通して次のステップに進む。
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain game/assets/units/manifest.json game/art/orders.json)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add game/assets/units/manifest.json game/art/orders.json
            git commit -m 'manifest.json と orders.json の status を自動更新'
            git push
          else
            echo 'manifest.json / orders.json に変更はありません'
          fi

      # 検査そのものが 効いているかを 先に 見る。
      # わざと 汚した 絵を つくって 捕まえられることを たしかめるので、
      # 「エラー0件」が 検査の 手ぬかりでは ないことを 保証できる。
      - name: 受け入れ検査そのものの テスト
        run: node scripts/check-assets.test.mjs

      - name: スプライトの受け入れ検査
        run: node scripts/check-assets.mjs

      # 機械は「仕様どおりか」しか 見られない。**絵として 良いか**は 人が 見るしかない。
      # 見るのを いちばん 安くするため、1枚に まとめて ここに 置いておく。
      # 検査が 落ちても 作る（落ちた絵こそ 見たいので）。
      - name: 絵の一覧をつくる
        if: always()
        run: node scripts/make-contact-sheet.mjs artifacts/contact-sheet.png

      - name: 絵の一覧をのこす
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: artifacts/contact-sheet.png
          if-no-files-found: ignore

  game-tests:
    # 絵を差し替えてもゲームが壊れていないことを確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ルールの単体テスト
        run: node game/test/engine.test.mjs
